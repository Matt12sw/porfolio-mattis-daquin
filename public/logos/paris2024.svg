<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Jeux Olympiques Paris 2024">
  <rect width="100" height="100" fill="#ffffff"/>
  <g fill="none" stroke-width="4.2">
    <!-- rangée haute : bleu, noir, rouge -->
    <circle cx="30" cy="40" r="13" stroke="#0081C8"/>
    <circle cx="50" cy="40" r="13" stroke="#000000"/>
    <circle cx="70" cy="40" r="13" stroke="#EE334E"/>
    <!-- rangée basse : jaune, vert -->
    <circle cx="40" cy="55" r="13" stroke="#FCB131"/>
    <circle cx="60" cy="55" r="13" stroke="#00A651"/>
  </g>
  <text x="50" y="88" font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="12" text-anchor="middle" fill="#000000">PARIS 2024</text>
</svg>
